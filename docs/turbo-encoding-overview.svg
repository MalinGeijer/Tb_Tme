<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Turbo encoding overview</title>
  <desc id="desc">The information block feeds encoder A in its original order and encoder B through the interleaver. Each encoder is terminated separately. Systematic bits and selected parity bits are serialized into a codeword.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172033; }
      .heading { font-size: 28px; font-weight: bold; }
      .label { font-size: 19px; font-weight: bold; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="40" y="48" class="heading">How a Turbo codeword is formed</text>
  <text x="40" y="80" class="body">Algorithm overview for project code rates 1/2, 1/4 and 1/6 • no clock or DUT model</text>

  <rect x="40" y="220" width="210" height="115" class="box"/>
  <text x="60" y="254" class="label">Information block</text>
  <text x="60" y="284" class="body">k bits: u(1) … u(k)</text>
  <text x="60" y="311" class="small">Same block for both paths</text>

  <path d="M250 255 H280 V160 H525" class="line"/>
  <text x="300" y="143" class="small">Original order: u(s)</text>
  <path d="M280 160 V115 H845 V180 H885" class="line"/>
  <text x="480" y="105" class="small">Systematic bits: information + four termination bits from A</text>

  <rect x="525" y="150" width="245" height="150" class="box"/>
  <text x="545" y="184" class="label">Component encoder A</text>
  <text x="545" y="214" class="body">Recursive convolutional code</text>
  <text x="545" y="244" class="body">4 memory bits, 16 states</text>
  <text x="545" y="274" class="small">Parity: out1a, out2a, out3a</text>

  <path d="M250 295 H290 V390 H325" class="line"/>
  <rect x="325" y="340" width="170" height="105" class="box"/>
  <text x="344" y="375" class="label">Interleaver</text>
  <text x="344" y="405" class="body">u(π(s))</text>
  <text x="344" y="430" class="small">Permutes k bits</text>
  <path d="M495 390 H525" class="line"/>

  <rect x="525" y="340" width="245" height="150" class="box"/>
  <text x="545" y="374" class="label">Component encoder B</text>
  <text x="545" y="404" class="body">Recursive convolutional code</text>
  <text x="545" y="434" class="body">4 memory bits, 16 states</text>
  <text x="545" y="464" class="small">Used parity: out1b, out3b</text>

  <path d="M770 235 H885" class="line"/>
  <path d="M770 415 H820 V310 H885" class="line"/>
  <rect x="885" y="150" width="275" height="210" class="box"/>
  <text x="905" y="192" class="label">Select and serialize</text>
  <text x="905" y="228" class="body">Code rate controls selection</text>
  <text x="905" y="260" class="body">1/2: alternating A/B parity</text>
  <text x="905" y="292" class="body">1/4 and 1/6: fixed order</text>
  <text x="905" y="330" class="small">See output sequences below</text>
  <path d="M1020 360 V405" class="line"/>
  <rect x="885" y="410" width="275" height="80" class="box"/>
  <text x="905" y="441" class="label">Turbo codeword</text>
  <text x="905" y="473" class="body">n = (k + 4) / r bits</text>

  <rect x="40" y="520" width="1120" height="95" rx="12" fill="#fff7ed" stroke="#c2410c"/>
  <text x="60" y="551" class="label">Initialization and termination</text>
  <text x="60" y="580" class="body">Both encoders start at zero. After k information steps, each runs four steps using its own feedback.</text>
  <text x="60" y="603" class="small">Both final states are zero. Termination steps also produce output; termination bits do not pass through the interleaver.</text>

  <text x="40" y="651" class="label">Output sequences in transmission order</text>
  <text x="40" y="685" class="body">1/2: (out0a, out1a) at the first step, (out0a, out1b) at the next; repeat through termination.</text>
  <text x="40" y="717" class="body">1/4: (out0a, out2a, out3a, out1b) at each step.</text>
  <text x="40" y="749" class="body">1/6: (out0a, out1a, out2a, out3a, out1b, out3b) at each step.</text>
  <text x="40" y="785" class="small">out0a is the systematic output. The other named outputs are parity from encoder A or B.</text>
  <text x="40" y="814" class="small">Reference: CCSDS 131.0-B-5, Issue 5, September 2023, 6.3 g–j and Figures 6-1–6-3.</text>
  <text x="40" y="837" class="small">The diagram shows the encoding core. ASM, randomization, byte packing and file handling are not shown.</text>
</svg>
